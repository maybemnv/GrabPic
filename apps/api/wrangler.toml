name = "grabpic-api"
main = "src/index.ts"
compatibility_date = "2025-01-01"

[[r2_buckets]]
binding = "PHOTOS"
bucket_name = "grabpic-photos"

[[queues.producers]]
binding = "PROCESSING_QUEUE"
queue = "grabpic-processing"

[[queues.consumers]]
queue = "grabpic-processing"
max_batch_size = 1
max_concurrency = 1
max_retries = 20
dead_letter_queue = "grabpic-processing-dead"

[[queues.consumers]]
queue = "grabpic-processing-dead"
max_batch_size = 10
max_retries = 5

[[ratelimits]]
name = "RATE_LIMITER"
namespace_id = "1001"

  [ratelimits.simple]
  limit = 120
  period = 60

[vars]
LOG_LEVEL = "info"
MATCH_THRESHOLD = "0.6"
R2_BUCKET = "grabpic-photos"

[triggers]
crons = ["0 3 * * *"]

[env.dev]
vars = { LOG_LEVEL = "debug" }
