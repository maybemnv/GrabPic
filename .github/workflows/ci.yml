name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.33.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm build
      - run: test -f apps/web/out/index.html
      - run: pnpm vitest run
      - name: Validate Worker bindings without deploying
        run: pnpm --filter @grabpic/api exec wrangler deploy --dry-run --env='' --outdir /tmp/grabpic-worker-dryrun
      - name: Compile Cloudflare Pages Functions
        run: pnpm --filter @grabpic/api exec wrangler pages functions build ../../functions --outdir /tmp/grabpic-pages-functions
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install lightweight Python test dependencies
        run: python -m pip install numpy==1.26.4 scikit-learn==1.5.2 fastapi==0.115.12 pillow==10.2.0
      - name: Run processor contracts without inference
        run: python -m unittest ml/test_processor.py ml/test_server.py
      - run: python -m compileall -q ml
